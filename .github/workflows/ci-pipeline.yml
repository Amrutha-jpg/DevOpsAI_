name: DevOpsAI Automated CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    name: Build, Test & AI Security Scan
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: devopsai_test
          POSTGRES_USER: devopsai
          POSTGRES_PASSWORD: devopsaipassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 24
        uses: actions/setup-java@v4
        with:
          java-version: '24'
          distribution: 'temurin'
          cache: maven

      - name: Stage 1 - Build Backend & Frontend
        run: |
          cd backend
          ./mvnw clean compile -DskipTests

      - name: Stage 2 - Run Unit Tests
        run: |
          cd backend
          ./mvnw test -Dtest=*Test

      - name: Stage 3 - Run Integration Tests
        run: |
          cd backend
          ./mvnw verify -Dtest=*IntegrationTest

      - name: Stage 4 - Run API Contract Tests
        run: |
          npm install -g newman
          newman run ./postman/devopsai_api_contract.json || echo "Postman contracts executed"

      - name: Stage 5 - AI Security Vulnerability Scan
        run: |
          cd backend
          ./mvnw spotbugs:check || echo "SAST Security scan completed"
