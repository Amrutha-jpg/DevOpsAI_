services:
  db:
    image: postgres:16-alpine
    container_name: devopsai-postgres-prod
    environment:
      POSTGRES_DB: devopsai
      POSTGRES_USER: ${DB_USERNAME:-devopsai_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-devopsai_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - devopsai-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-devopsai_user} -d devopsai"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: devopsai-backend:latest
    container_name: devopsai-backend-prod
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://db:5432/devopsai
      DB_USERNAME: ${DB_USERNAME:-devopsai_user}
      DB_PASSWORD: ${DB_PASSWORD:-devopsai_password}
      JWT_SECRET: ${JWT_SECRET:-9a6f8b12c4d5e6f7a8b9c0d1e2f3a4b5c6d7e8f9a0b1c2d3e4f5a6b7c8d9e0f1}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-86400000}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:-}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost,http://localhost:80}
    networks:
      - devopsai-network
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--spider", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: devopsai-frontend:latest
    container_name: devopsai-frontend-prod
    ports:
      - "80:80"
    networks:
      - devopsai-network
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

networks:
  devopsai-network:
    driver: bridge

volumes:
  postgres_data:
